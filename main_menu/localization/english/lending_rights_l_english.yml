l_english:
 lending_rights_relation: "Lending Rights"
 lending_rights_relation_desc: "A [country|e] lets a banking house take over every new loan its [estates|e] issue and every new [government_bond|e] it sells. The bank fronts the money and collects the repayments. Bonds become ordinary 10 year loans owed to the bank."
 lending_rights_signing_bonus_reason: "Signing Payment"
 lending_rights_effect_text: "Lending Rights"
 lending_rights_effect_text_past: "Granted Lending Rights"

 request_lending_rights: "Purchase Lending Rights"
 request_lending_rights_CATEGORY: "CATEGORY_BANKING_ACTIONS"
 request_lending_rights_cta: "Purchase Lending Rights from [SCOPE.sCountry('recipient').GetName]"
 request_lending_rights_desc: "We pay them a one-off sum. From then on, every loan they take from their [estates|e] and every [government_bond|e] they sell is held by us instead, as long as we can front the money. Bonds become 10 year loans."
 request_lending_rights_cta_to_unknown: "Purchase Lending Rights from a [country|e]"
 request_lending_rights_desc_to_unknown: "We pay them a one-off sum. From then on, every loan they take from their [estates|e] and every [government_bond|e] they sell is held by us instead, as long as we can front the money. Bonds become 10 year loans."
 request_lending_rights_happened_title: "Lending Rights Purchased"
 request_lending_rights_happened_desc: "[SCOPE.sCountry('actor').GetName] has purchased the rights to all future loans of [SCOPE.sCountry('recipient').GetName]."
 request_lending_rights_proposal_question: "Purchase the rights to all future loans of [TARGET_COUNTRY.GetName]?\n$INFO$"
 request_lending_rights_incoming_proposal_title: "Offer to Purchase Lending Rights"
 request_lending_rights_incoming_proposal_question: "[COUNTRY.GetName] offers to buy the rights to every loan we take and every bond we sell from now on, paying us a one-off sum. Our bonds would become 10 year loans owed to them. Do we accept?"

 cancel_lending_rights: "Release Lending Rights"
 cancel_lending_rights_CATEGORY: "CATEGORY_BANKING_ACTIONS"
 cancel_lending_rights_cta: "Release [SCOPE.sCountry('recipient').GetName] from our Lending Rights"
 cancel_lending_rights_desc: "Their future loans and bonds will be their own affair again."
 cancel_lending_rights_cta_to_unknown: "Release a [country|e] from our Lending Rights"
 cancel_lending_rights_desc_to_unknown: "Their future loans and bonds will be their own affair again."
 cancel_lending_rights_happened_title: "Lending Rights Released"
 cancel_lending_rights_happened_desc: "[SCOPE.sCountry('actor').GetName] no longer holds the rights to [SCOPE.sCountry('recipient').GetAdjective] loans."
 cancel_lending_rights_proposal_question: "Release [TARGET_COUNTRY.GetName] from our Lending Rights?\n$INFO$"

 break_lending_rights: "Revoke Lending Rights"
 break_lending_rights_CATEGORY: "CATEGORY_BANKING_ACTIONS"
 break_lending_rights_cta: "Revoke the Lending Rights of [SCOPE.sCountry('recipient').GetName]"
 break_lending_rights_desc: "Our future loans and bonds will be our own affair again."
 break_lending_rights_cta_to_unknown: "Revoke a [country|e]'s Lending Rights"
 break_lending_rights_desc_to_unknown: "Our future loans and bonds will be our own affair again."
 break_lending_rights_happened_title: "Lending Rights Revoked"
 break_lending_rights_happened_desc: "[SCOPE.sCountry('actor').GetName] has revoked the Lending Rights of [SCOPE.sCountry('recipient').GetName]."
 break_lending_rights_proposal_question: "Revoke the Lending Rights of [TARGET_COUNTRY.GetName]?\n$INFO$"

 diplomatic_status_giving_lending_rights_name: "Granted Lending Rights"
 diplomatic_status_giving_lending_rights_tooltip: "Has granted Lending Rights to $LIST$"
 diplomatic_status_receiving_lending_rights_name: "Holds Lending Rights"
 diplomatic_status_receiving_lending_rights_tooltip: "Holds the Lending Rights of $LIST$"
 giving_lending_rights_list_who_tt: "$WHO$ has granted Lending Rights to $LIST$"
 receiving_lending_rights_list_who_tt: "$WHO$ holds the Lending Rights of $LIST$"
