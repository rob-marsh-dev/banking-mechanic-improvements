 request_bank_mint_contract_incoming_proposal_title: "Mint Contract Offer"
 request_bank_mint_contract_incoming_proposal_question: "[COUNTRY.GetName] offers us a one-off sum to run our mint. We would mint more cleanly, and they would take a monthly cut of what we strike. Do we accept?"

