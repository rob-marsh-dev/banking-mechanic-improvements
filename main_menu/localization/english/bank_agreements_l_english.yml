 #Mint Contract
 bank_mint_contract_relation: "Mint Contract"
 bank_mint_contract_relation_desc: "A banking house runs the mint of a [country|e]. The country earns more from [minting|e] and can mint more before causing [inflation|e], and the bank takes a monthly cut that grows the harder the mint is worked."
 bank_mint_contract_signing_bonus_reason: "Signing Payment"
 bank_mint_contract_effect_text: "Mint Contract"
 bank_mint_contract_effect_text_past: "Under a Mint Contract"

 request_bank_mint_contract: "Sign Mint Contract"
 request_bank_mint_contract_CATEGORY: "CATEGORY_BANKING_ACTIONS"
 request_bank_mint_contract_cta: "Sign a Mint Contract with [SCOPE.sCountry('recipient').GetName]"
 request_bank_mint_contract_desc: "We pay them a one-off sum and take over their mint. They earn more from [minting|e] with less [inflation|e], and we take a monthly cut that grows the more they mint. A country that mints nothing pays us nothing."
 request_bank_mint_contract_cta_to_unknown: "Sign a Mint Contract with a [country|e]"
 request_bank_mint_contract_desc_to_unknown: "We pay them a one-off sum and take over their mint. They earn more from [minting|e] with less [inflation|e], and we take a monthly cut that grows the more they mint. A country that mints nothing pays us nothing."
