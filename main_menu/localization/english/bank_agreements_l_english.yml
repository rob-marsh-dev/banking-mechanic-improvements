 #Standing Retainer
 bank_standing_retainer_relation: "Standing Retainer"
 bank_standing_retainer_relation_desc: "A banking house pays a [country|e] a fee every month. In return that country answers the bank's call to arms in every [war|e], until the agreement ends."
 bank_standing_retainer_fee_reason: "Monthly Retainer"
 bank_standing_retainer_effect_text: "Standing Retainer"
 bank_standing_retainer_effect_text_past: "On Retainer"

 request_bank_standing_retainer: "Put on Standing Retainer"
 request_bank_standing_retainer_CATEGORY: "CATEGORY_BANKING_ACTIONS"
 request_bank_standing_retainer_cta: "Put [SCOPE.sCountry('recipient').GetName] on a Standing Retainer"
 request_bank_standing_retainer_desc: "We pay them a tenth of their own income every month. In return they are called into our [wars|e], whether we attack or are attacked. We must hold a year of the fee in reserve to sign."
 request_bank_standing_retainer_cta_to_unknown: "Put a [country|e] on a Standing Retainer"
