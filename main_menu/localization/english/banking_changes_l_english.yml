 #Creditor's League — Construction Law
 creditors_league_construction_law: "Construction Rights"
 creditors_league_construction_law_desc: "Determines whether the banking nation may fund and build infrastructure within member territories. A subtle but powerful lever of economic control."
 cl_con_no_build_policy: "No Construction Rights"
 cl_con_no_build_policy_desc: "The banking nation has no right to build within member territories. Each state controls its own development."
 cl_con_build_policy: "Construction Rights"
 cl_con_build_policy_desc: "The banking nation may fund and construct buildings within member states, extending its financial infrastructure across the league."

