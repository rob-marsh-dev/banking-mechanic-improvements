l_english:

 banker_shipwright_branch: "Banker Shipyard"
 banker_shipwright_branch_desc: "This building represents a shipyard owned and loyal to the banking family. We will still need permission from the local authority to build ships, however."
 bank_recruitment: "Bank-Owned Recruitment Firm"
 bank_recruitment_desc: "This building represents a building we may hire armed thugs, erm, agents from. We will still need permission from the local authority to recruit regiments, however."
 realm_in_arrears: "Realm in Arrears"
 realm_in_arrears_desc: "Through politicking and brazen threat, we have leveraged this realms financial weakness to assume control of its government and coinage systems."
 create_realm_in_arrears: "Demand that [TARGET_COUNTRY.GetName] makes good on all we have lent them."
 construction_rights: "Construction Rights"
 construction_rights_desc: "This nation has granted the banking family the right to build within their territory. In exchange, they benefit from a small reduction in borrowing costs."
 create_construction_rights: "Negotiate Construction Rights with [TARGET_COUNTRY.GetName]"
 currency_exchange: "Currency Exchange"
 currency_exchange_desc: "Here, our bankers swap and change money for a fee. This allows to influence trade in ways that grow our coffers, while collecting a tidy profit."
 currency_exchange_maintenance: "Needs of Currency Exchanges"
 banking_mining_interest: "Banker Mining Interest"
 banking_mining_interest_desc: "A series of pawnbrokers, hands-for-hire and brutes ensure we get our pound of flesh from these valuable mines."
 banker_art_imporium: "Art Emporium"
 banker_art_imporium_desc: "Here talented artists, poets, painters and sculptors of every persuasion toil for one thing only - to ensure our family name is on the worlds lips."
 bankers_kontor: "Bankers Kontor"
 bankers_kontor_desc: "By investing in local infrastructure, we can hire our own merchants to trade for us."
 bankers_kontor_maintenance: "Bankers Kontor"
 family_factor_house: "Family Factor House"
 family_factor_house_desc: "Our family stations a senior factor at the court itself, handling the crown's coin alongside its own. The host's treasury and ours grow stout together — and when the throne needs a loan, the conversation happens at supper."
 family_factor_house_maintenance: "Needs of the Factor House"
 family_factor_house_min_rank_tt: "Host country must be at least a Duchy"
 #cabinet actions
 bank_expand_diplomat_network: "Expand Diplomatic Network"
 bank_expand_diplomat_network_desc: "By dispatching trusted agents and family members to courts across the continent, we can grow our network of diplomatic contacts."
 bank_expand_diplomat_network_active: "Expanding our Diplomatic Network"
 bank_expand_diplomat_network_action: "Expand our Diplomatic Network"


 bank_monopolize_commerce: "Monopolize Local Commerce"
 bank_monopolize_commerce_desc: "By leveraging our financial network, we can quietly undercut local merchant guilds — diverting trade revenues into our coffers while eroding their political standing."
 bank_monopolize_commerce_active: "Monopolizing Local Commerce"
 bank_monopolize_commerce_action: "Monopolize Local Commerce"

 #advances
 bank_embed_diplomats_in_court: "Embeded Diplomats In Court"
 bank_embed_diplomats_in_court_desc: "By sending trusted sons and cousins to our client realms, we can quickly gain information to leverage against our foes."
 bank_cultural_phenomon: "Cultural Phenomena"
 bank_cultural_phenomon_desc: "The banking clans trace their route back to Italy during the renaissance, and the renaissance can trace its own spread to our family bank."
 bank_art_imporium: "Art Imporium"
 bank_art_imporium_desc: "We work hard to gain the wealth we have - what good is any of it if we cannot display our power to the masses?"
 bank_head_of_the_family: "Head of the Family"
 bank_head_of_the_family_desc: "What the kings and queen of Old Europe dont understand, is that a family is many people, all in tandem ensuring one mans ambition."
 bank_decentralized_branches: "Decentralized Branches"
 bank_decentralized_branches_desc: "As the family grows both in power and number, by sending off our distant cousins and nephews, we can spread our family, and therefore reach, even further."
 bank_mining_interests: "Mining Interests"
 bank_mining_interests_desc: "Our world turns on a florin for gold and silver. While we stick to the cities, we would be fools not to attempt to expand our influence were these precious metals are mined."

