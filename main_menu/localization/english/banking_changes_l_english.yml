 #Creditor's League — Military Law
 creditors_league_intelligence_law: "Intelligence Sharing"
 creditors_league_intelligence_law_desc: "Determines whether the banking nation may maintain a shared intelligence network across league members, granting visibility into their territories."
 cl_intel_closed_policy: "No Intelligence Sharing"
 cl_intel_closed_policy_desc: "Member states maintain sovereign control over their own intelligence. The banking nation has no special visibility into member territories."
 cl_intel_share_policy: "Shared Intelligence Network"
 cl_intel_share_policy_desc: "The banking nation embeds agents and financial observers across all member states, granting mutual visibility throughout the league."
 CL_INTEL_MEMBER_WANTS_CLOSED: "We do not wish to be observed"
 CL_INTEL_MEMBER_KEEPS_CLOSED: "We prefer to keep our affairs private"
 CL_INTEL_LEADER_WANTS_OPEN: "We want visibility over our investments"
