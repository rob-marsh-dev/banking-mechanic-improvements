 #Creditor's League — Internal Relations Law
 creditors_league_internal_law: "Internal Relations"
 creditors_league_internal_law_desc: "Governs whether member states may wage war against one another. A peaceful league is a stable league — but some banking nations prefer their clients divided."
 cl_int_open_policy: "Open Competition"
 cl_int_open_policy_desc: "Member states are free to wage war against one another. The bank takes no position on conflicts within the league."
 cl_int_peace_policy: "League Peace"
 cl_int_peace_policy_desc: "Wars between member states are forbidden. The league is to be a zone of financial cooperation, not mutual bloodshed."

 #Internal relations vote reasons
 CL_INT_MEMBER_WANTS_OPEN: "We prize the freedom to pursue our own quarrels"
 CL_INT_MEMBER_KEEPS_OPEN: "We wish to retain the right to settle scores within the league"
 CL_INT_NO_INTERNECINE_WARS: "Peace within the league benefits us all"

 #Creditor's League — Subjugation Law
 creditors_league_subjugation_law: "Subjugation Rights"
 creditors_league_subjugation_law_desc: "Governs whether members of the league may bind new vassals, tributaries, and other subjects to themselves. A league of equals cannot tolerate its members swallowing their neighbours — but some banks see no profit in restraining ambitious clients."
 cl_sub_free_policy: "Free Hand"
 cl_sub_free_policy_desc: "Members may pursue subjugation of foreign powers without league interference. The bank takes no view on the size of its clients' realms."
 cl_sub_forbidden_policy: "League Discipline"
 cl_sub_forbidden_policy_desc: "Members are forbidden from acquiring new subjects by any means. Any vassal, tributary or other subject relation a member attempts to establish is immediately annulled by league writ. The banking nation itself is exempt — its dignity must be preserved."

 #Subjugation law vote reasons
 CL_SUB_MEMBER_WANTS_FREEDOM: "We will not surrender our right to bind our neighbours"
 CL_SUB_MEMBER_KEEPS_FREEDOM: "We wish to retain the freedom to take our own subjects"
 CL_SUB_LEADER_INDIFFERENT: "Restraining our clients' ambitions would steady the league"
 CL_SUB_LEADER_WANTS_DISCIPLINE: "A league of competing empires serves us poorly"
 CL_SUB_LEADER_KEEPS_DISCIPLINE: "League discipline keeps our clients suitably small"
 CL_SUB_MEMBER_RESENTS_DISCIPLINE: "The bank would deny us the fruits of conquest"
 CL_SUB_MEMBER_RESISTS_DISCIPLINE: "We chafe under the bank's restraint on our ambitions"

 #Creditor's League — External Relations Law
 creditors_league_external_law: "External Relations"
 creditors_league_external_law_desc: "Governs the degree of diplomatic independence enjoyed by member states in their dealings with outside powers. At lower tiers members are free; at higher tiers they are bound to the bank's wars and foreign policy."
 cl_ext_free_policy: "Independent Diplomacy"
 cl_ext_free_policy_desc: "Member states conduct their own foreign affairs without restriction. The league imposes no obligations on who they fight or favour."
 cl_ext_defensive_policy: "Mutual Defence"
 cl_ext_defensive_policy_desc: "When any member of the league is attacked, all others must come to its defence. The bank's credit is underwritten by its members' swords."
 cl_ext_offensive_policy: "Offensive Alliance"
 cl_ext_offensive_policy_desc: "Members must join offensive wars declared by the league leader. The bank may now call its clients to war as well as peace."
 cl_ext_restricted_policy: "Restricted Diplomacy"
 cl_ext_restricted_policy_desc: "The banking nation assumes broad oversight of member diplomacy. Member states find their independent reach constrained, while the bank's influence grows."
 cl_ext_sovereignty_policy: "Financial Sovereignty"
 cl_ext_sovereignty_policy_desc: "The banking nation holds near-complete sway over its clients. Member states are sovereign in name only — their foreign policy is the bank's to command."

