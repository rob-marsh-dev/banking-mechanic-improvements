 cl_intel_closed_policy_desc: "Member states maintain sovereign control over their own intelligence. The banking nation has no special visibility into member territories."
 cl_intel_share_policy: "Shared Intelligence Network"
 cl_intel_share_policy_desc: "The banking nation embeds agents and financial observers across all member states, granting mutual visibility throughout the league."
