 creditors_league_military_law: "Military Oversight"
 creditors_league_military_law_desc: "Determines the extent to which the banking nation may raise armies, build fortifications, and launch fleets from within its member states."
 cl_mil_no_access_policy: "Non-Interference"
 cl_mil_no_access_policy_desc: "The banking nation has no special military rights within member territories. Each state maintains full control of its own defences."
 cl_mil_recruit_policy: "Recruitment Rights"
 cl_mil_recruit_policy_desc: "The banking nation may raise regiments from the populations of member states, drawing on their manpower for its own campaigns."
 cl_mil_navy_policy: "Full Military Access"
 cl_mil_navy_policy_desc: "The banking nation may recruit regiments and launch warships from member ports at will."

